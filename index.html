<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <meta name="description" content="PWA para corte de caja por cantidad de billetes y monedas." />

  <title>Corte de Caja</title>

  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./assets/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <main class="app-shell">
    <section class="app-card">
      <header class="app-header">
        <div>
          <p class="eyebrow">Corte de caja</p>
          <h1 id="mainTitle">Captura</h1>
        </div>
        <span class="status-pill" id="statusPill">1/12</span>
      </header>

      <div class="progress" aria-hidden="true">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <section id="screen" class="screen" aria-live="polite"></section>
    </section>
  </main>

  <noscript>
    <div class="noscript">Esta herramienta necesita JavaScript habilitado.</div>
  </noscript>

  <script src="./app.js"></script>
</body>
</html>
